# This machine's Laragon uses port 8080. Port 80 is also bound on loopback for huit-schedule.test.
# If Apache already listens on port 80, remove the Listen directive below.
Listen 127.0.0.1:80

<Directory "C:/laragon/www/TimeTable/huit-schedule">
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:80 *:8080>
    ServerName huit-schedule.test
    DocumentRoot "C:/laragon/www/TimeTable/huit-schedule/public"

    <Directory "C:/laragon/www/TimeTable/huit-schedule/public">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
